apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "el-sitio.fullname" . }}
  labels:
    {{- include "el-sitio.labels" . | nindent 4 }}
spec:
  # Un seul exemplaire (base SQLite), et l'ancien s'arrête avant que le nouveau démarre.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "el-sitio.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "el-sitio.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        # Utilisateur « node » de l'image : il doit pouvoir écrire sur le disque.
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      # Laisse le temps de la dernière sauvegarde à l'arrêt.
      terminationGracePeriodSeconds: 30
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: BRUMELAND_ADRESSE
              value: {{ .Values.adressePublique | quote }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /api/sante
              port: http
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /api/sante
              port: http
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/sante
              port: http
            periodSeconds: 5
          volumeMounts:
            - name: donnees
              mountPath: /app/data
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: donnees
          persistentVolumeClaim:
            claimName: {{ include "el-sitio.fullname" . }}-donnees
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
