apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "el-sitio.fullname" . }}-donnees
  labels:
    {{- include "el-sitio.labels" . | nindent 4 }}
  annotations:
    # La partie ne doit jamais disparaître avec une mise à jour ou une suppression.
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
