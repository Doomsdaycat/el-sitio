# Fabrication de l'image Docker, à chaque étiquette v* (lancée par « npm run mettre-en-ligne »).
# Seulement dans le dépôt d'hébergement el-sitio : l'image ghcr.io/doomsdaycat/el-sitio est celle
# que le serveur de l'hébergeur (ArgoCD) installe.
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  release:
    if: github.repository == 'Doomsdaycat/el-sitio'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Vérifications avant fabrication
        run: |
          npm ci
          npm run verifier
          npm run tester
          helm lint chart

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Essai de l'image
        run: |
          docker run -d --name essai -p 3000:3000 "ghcr.io/doomsdaycat/el-sitio:${GITHUB_REF_NAME#v}"
          for i in $(seq 30); do curl -sf localhost:3000/api/sante && exit 0; sleep 1; done
          docker logs essai
          exit 1
